[pytest]
# Graded suites only. Without testpaths, a bare `pytest` at the repo root also
# walks scratch/ (untracked local experiments) and phase1/venv/, neither of
# which contains graded tests.
testpaths =
    phase1/tests
    phase2/tests
    phase3/tests
    phase4/tests
    phase5/tests

# phase4/tests/test_coverage_boost.py and phase5/tests/test_coverage_boost.py
# share a basename. Under the default "prepend" import mode pytest derives a
# module name from the path and the two collide, aborting collection for the
# WHOLE repo with "Interrupted: 1 error during collection" -- a bare `pytest`
# collected 0 of 164 tests. importlib mode does not require unique basenames.
addopts = --import-mode=importlib

norecursedirs = scratch venv .venv node_modules build dist *.egg-info __pycache__
