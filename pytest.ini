[pytest]
# All five graded suites now live under tests/. `scratch/`, `phase1/venv/` and the
# per-phase source bridges that used to make an unscoped run misbehave are gone,
# but testpaths is kept so a bare `pytest` has one unambiguous root.
testpaths = tests

# tests/phase4/test_coverage_boost.py and tests/phase5/test_coverage_boost.py
# share a basename. Under the default "prepend" import mode pytest derives a
# module name from the path and the two collide, aborting collection for the
# WHOLE repo with "Interrupted: 1 error during collection" -- a bare `pytest`
# collected 0 of 164 tests. importlib mode does not require unique basenames.
addopts = --import-mode=importlib

norecursedirs = venv .venv node_modules build dist *.egg-info __pycache__
