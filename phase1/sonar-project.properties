# SonarQube / SonarScanner Configuration for Phase 1
sonar.projectKey=POC-07-Inventory-Phase1
sonar.projectName=POC-07 Retail Inventory Management & Procurement System - Phase 1
sonar.projectVersion=1.0.0
sonar.host.url=http://localhost:9001

# Language & Source directories
sonar.sources=app
sonar.tests=tests
sonar.language=py
sonar.python.version=3.11, 3.12, 3.13, 3.14

# Test execution & coverage reports
sonar.python.xunit.reportPath=results/phase1-results.xml
sonar.python.coverage.reportPaths=results/coverage.xml

# Exclusions
sonar.exclusions=**/htmlcov/**, **/results/**, **/.pytest_cache/**, **/node_modules/**
