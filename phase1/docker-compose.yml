# SonarQube scanner stack for Phase 1. `version:` removed -- obsolete in Compose
# v2, which warned about it on every invocation.
services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9001:9000"
    environment:
      - SONAR_FORCEAUTHENTICATION=false
    restart: unless-stopped

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: sonar-scanner
    volumes:
      - .:/usr/src
    environment:
      - SONAR_HOST_URL=${SONAR_HOST_URL:-http://host.docker.internal:9001}
      # A live SonarQube user token was hardcoded here and committed. Removed;
      # pass it in via the environment. Treat the old value as compromised and
      # revoke it in SonarQube. See also the root docker-compose.yml.
      - SONAR_TOKEN=${SONAR_TOKEN:-}
    profiles:
      - scanner
