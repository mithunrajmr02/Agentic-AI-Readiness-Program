# SonarQube / SonarScanner Configuration for Phase 2
sonar.projectKey=POC-07-Inventory-Phase2
sonar.projectName=POC-07 Retail Inventory Management & Procurement System - Phase 2 (RAG Application)
sonar.projectVersion=1.0.0
sonar.host.url=http://localhost:9001

# Language & Source directories
sonar.sources=phase2/rag
sonar.tests=phase2/tests
sonar.language=py
sonar.python.version=3.11, 3.12, 3.13, 3.14

# Exclude UI web layout from coverage (Streamlit app interface)
sonar.exclusions=**/app.py, **/htmlcov/**, **/results/**, **/.pytest_cache/**, **/node_modules/**

# Test execution & coverage reports
sonar.python.xunit.reportPath=phase2/results/phase2-results.xml
sonar.python.coverage.reportPaths=phase2/results/coverage.xml
